# Cargo.toml

[[bin]]
name = "test_e2e"
path = "test/test_e2e.rs"

[package]
name = "plant_shop_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
poem = { version = "3.1", features = ["websocket", "cookie"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "bigdecimal"] }
tokio = { version = "1.37", features = ["full"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
jsonwebtoken = "9"
thiserror = "1.0"
rand = "0.8"
bigdecimal = { version = "0.3.1", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "cookies", "json", "rustls-tls"] }
lipsum = "0.9"
cookie_store = "0.21"
url = "2.5"
futures = "0.3"
argon2 = "0.5"
password-hash = "0.5"
rand_core = "0.6"
num_cpus = "1.16"
async-trait = "0.1"
bytes = "1"
