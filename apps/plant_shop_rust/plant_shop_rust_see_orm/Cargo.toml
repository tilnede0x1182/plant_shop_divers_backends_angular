[[bin]]
name = "test_e2e"
path = "test/test_e2e.rs"

[package]
name = "plant_shop_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Framework HTTP principal ---
poem = { version = "3.1", features = ["websocket", "cookie"] }

# --- ORM principal du backend ---
sea-orm = { version = "1.1", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-macros = "1.1"

# --- ORM secondaire (pour seed et tests) ---
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "bigdecimal"] }

# --- Base technique ---
tokio = { version = "1.37", features = ["full"] }
dotenvy = "0.15"
bcrypt = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
jsonwebtoken = "9"
thiserror = "1.0"
rand = "0.8"
bigdecimal = { version = "0.3.1", features = ["serde"] }

# --- Client HTTP et outils ---
reqwest = { version = "0.12", features = ["blocking", "cookies", "json", "rustls-tls"] }
cookie_store = "0.21"
url = "2.5"

# --- Utilitaires ---
lipsum = "0.9"
futures = "0.3"
