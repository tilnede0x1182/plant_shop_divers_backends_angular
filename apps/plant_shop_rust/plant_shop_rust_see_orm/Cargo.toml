# ======================================================
# 🧱 Configuration principale du package
# ======================================================
[package]
name = "plant_shop_rust"
version = "0.1.0"
edition = "2021"

# ======================================================
# ⚙️  Binaires du projet
# ======================================================
[[bin]]
name = "plant_shop_rust"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "test_e2e"
path = "test/test_e2e.rs"

# ======================================================
# 🚀 Dépendances communes (SeaORM complet)
# ======================================================
[dependencies]
# --- Framework HTTP principal ---
poem = { version = "3.1", features = ["websocket", "cookie"] }

# --- ORM unique : SeaORM (PostgreSQL uniquement) ---
sea-orm = { version = "1.1", default-features = false, features = [
  "macros","runtime-tokio-rustls","sqlx-postgres","with-json","with-chrono","with-rust_decimal"
] }
sea-orm-macros = "1.1"

# --- Base technique ---
tokio = { version = "1.37", features = ["full"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
jsonwebtoken = "9"
thiserror = "1.0"
rand = "0.8"
rust_decimal = { version = "1", features = ["serde"] }
num-traits = "0.2"
bigdecimal = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
password-hash = "0.5"
rand_core = "0.6"

# --- Client HTTP et outils ---
reqwest = { version = "0.12", features = ["blocking", "cookies", "json", "rustls-tls"] }
cookie_store = "0.21"
url = "2.5"

# --- Utilitaires ---
lipsum = "0.9"
futures = "0.3"
